<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9fafb"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="#e0e7ff" opacity="0.5"/>
  <circle cx="700" cy="500" r="120" fill="#fce7f3" opacity="0.5"/>
  <circle cx="600" cy="150" r="60" fill="#fef3c7" opacity="0.3"/>
  
  <!-- Learner figure -->
  <g>
    <!-- Head -->
    <circle cx="150" cy="180" r="30" fill="#6366f1"/>
    <!-- Body -->
    <rect x="130" y="220" width="40" height="60" fill="#818cf8" rx="5"/>
    <!-- Arms -->
    <rect x="100" y="240" width="30" height="15" fill="#818cf8" rx="7"/>
    <rect x="170" y="240" width="30" height="15" fill="#818cf8" rx="7"/>
    <!-- Legs -->
    <rect x="135" y="285" width="10" height="40" fill="#6366f1" rx="5"/>
    <rect x="155" y="285" width="10" height="40" fill="#6366f1" rx="5"/>
    <!-- Book in hand -->
    <rect x="180" y="245" width="25" height="35" fill="#ec4899" rx="3"/>
  </g>
  
  <!-- Teacher figure -->
  <g>
    <!-- Head -->
    <circle cx="400" cy="150" r="30" fill="#10b981"/>
    <!-- Body -->
    <rect x="380" y="190" width="40" height="70" fill="#34d399" rx="5"/>
    <!-- Arms -->
    <rect x="350" y="210" width="30" height="15" fill="#34d399" rx="7"/>
    <rect x="420" y="210" width="30" height="15" fill="#34d399" rx="7"/>
    <!-- Legs -->
    <rect x="385" y="265" width="10" height="50" fill="#10b981" rx="5"/>
    <rect x="405" y="265" width="10" height="50" fill="#10b981" rx="5"/>
    <!-- Pointer -->
    <line x1="440" y1="220" x2="500" y2="280" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Parent/Caregiver figure -->
  <g>
    <!-- Head -->
    <circle cx="650" cy="180" r="30" fill="#f59e0b"/>
    <!-- Body -->
    <rect x="630" y="220" width="40" height="65" fill="#fbbf24" rx="5"/>
    <!-- Arms -->
    <rect x="600" y="240" width="30" height="15" fill="#fbbf24" rx="7"/>
    <rect x="670" y="240" width="30" height="15" fill="#fbbf24" rx="7"/>
    <!-- Legs -->
    <rect x="635" y="290" width="10" height="45" fill="#f59e0b" rx="5"/>
    <rect x="655" y="290" width="10" height="45" fill="#f59e0b" rx="5"/>
    <!-- Heart symbol -->
    <text x="650" y="250" font-size="30" text-anchor="middle" fill="#ef4444">♥</text>
  </g>
  
  <!-- Support pathway boxes -->
  <g>
    <!-- Box 1 -->
    <rect x="50" y="420" width="120" height="100" fill="#e0e7ff" rx="8" stroke="#6366f1" stroke-width="2"/>
    <text x="110" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="#6366f1">Assessment</text>
    <text x="110" y="475" font-size="12" text-anchor="middle" fill="#4f46e5">Professional</text>
    <text x="110" y="490" font-size="12" text-anchor="middle" fill="#4f46e5">guidance</text>
    
    <!-- Box 2 -->
    <rect x="210" y="420" width="120" height="100" fill="#dbeafe" rx="8" stroke="#3b82f6" stroke-width="2"/>
    <text x="270" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">Learning</text>
    <text x="270" y="475" font-size="12" text-anchor="middle" fill="#1e3a8a">Support</text>
    <text x="270" y="490" font-size="12" text-anchor="middle" fill="#1e3a8a">Strategies</text>
    
    <!-- Box 3 -->
    <rect x="370" y="420" width="120" height="100" fill="#fef3c7" rx="8" stroke="#f59e0b" stroke-width="2"/>
    <text x="430" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="#d97706">Resources</text>
    <text x="430" y="475" font-size="12" text-anchor="middle" fill="#b45309">Verified</text>
    <text x="430" y="490" font-size="12" text-anchor="middle" fill="#b45309">information</text>
    
    <!-- Box 4 -->
    <rect x="530" y="420" width="120" height="100" fill="#dcfce7" rx="8" stroke="#10b981" stroke-width="2"/>
    <text x="590" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">Community</text>
    <text x="590" y="475" font-size="12" text-anchor="middle" fill="#047857">Support</text>
    <text x="590" y="490" font-size="12" text-anchor="middle" fill="#047857">Network</text>
  </g>
  
  <!-- Connection lines -->
  <line x1="150" y1="330" x2="110" y2="420" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="320" x2="270" y2="420" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="650" y1="335" x2="430" y2="420" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Title text -->
  <text x="400" y="560" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">LearnAble: Educational Support for All</text>
</svg>